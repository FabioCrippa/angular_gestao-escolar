<div class="cadastro-usuario-container">
  <h1>Cadastro de Usuário</h1>
  <form (ngSubmit)="onSubmit()" [formGroup]="userForm">
    <!-- Nome -->
    <div class="form-group">
      <label for="name">Nome:</label>
      <input id="name" type="text" formControlName="name" placeholder="Digite o nome" required />
    </div>

    <!-- Email -->
    <div class="form-group">
      <label for="email">Email:</label>
      <input id="email" type="email" formControlName="email" placeholder="Digite o email" required />
    </div>

    <!-- Tipo de Acesso -->
    <div class="form-group">
      <label for="role">Tipo de Acesso:</label>
      <select id="role" formControlName="role" required>
        <option value="admin">Administrador</option>
        <option value="professor">Professor</option>
        <option value="aluno">Aluno</option>
      </select>
    </div>

    <!-- Login Gerado -->
    <div class="form-group">
      <label for="login">Login Gerado:</label>
      <input id="login" type="text" [value]="generatedLogin" readonly />
    </div>

    <!-- Senha Gerada -->
    <div class="form-group">
      <label for="password">Senha Gerada:</label>
      <input id="password" type="text" [value]="generatedPassword" readonly />
    </div>

    <!-- Botão de Cadastro -->
    <button type="submit" [disabled]="userForm.invalid">Cadastrar</button>
  </form>
</div>
