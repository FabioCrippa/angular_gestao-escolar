<div class="mensagens-container">
  <h1>Envio de Mensagens</h1>
  <p>Envie mensagens importantes para alunos, professores ou responsáveis via WhatsApp ou e-mail.</p>

  <!-- Formulário de Mensagens -->
  <form class="mensagens-form">
    <div class="form-group">
      <label for="recipient">Destinatário:</label>
      <select id="recipient" name="recipient" required>
        <option value="">Selecione o destinatário</option>
        <option value="alunos">Alunos</option>
        <option value="professores">Professores</option>
        <option value="responsaveis">Responsáveis</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message-type">Tipo de Mensagem:</label>
      <select id="message-type" name="message-type" required>
        <option value="">Selecione o tipo</option>
        <option value="whatsapp">WhatsApp</option>
        <option value="email">E-mail</option>
      </select>
    </div>

    <div class="form-group">
      <label for="message-content">Mensagem:</label>
      <textarea
        id="message-content"
        name="message-content"
        rows="5"
        placeholder="Digite sua mensagem aqui..."
        required
      ></textarea>
    </div>

    <div class="form-actions">
      <button type="button" (click)="sendWhatsAppMessage()">Enviar via WhatsApp</button>
      <button type="button" (click)="sendEmailMessage()">Enviar via E-mail</button>
    </div>
  </form>
</div>
