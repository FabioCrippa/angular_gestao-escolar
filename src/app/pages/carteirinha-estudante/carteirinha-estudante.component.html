<div class="school-card__container">
  <div class="school-card">
    <div class="header__container">
      <div class="title">
        <h1>Carteirinha de Estudante</h1>
      </div>

      <div class="img__perfile">
        <img src="https://cdn-icons-png.flaticon.com/512/9159/9159762.png" alt="Foto do Estudante" />
      </div>

      <div class="img__qrcode">
        <img src="https://img.icons8.com/?size=100&id=6ozUksPEPg6G&format=png&color=000000" alt="QR Code" />
      </div>
    </div>

    <div class="personal-data__container">
      <div class="img__logo">
        <img src="https://blogsomoseducacao.com.br/wp-content/uploads/2020/04/anglo-logo.png" alt="Logo da Escola" />
      </div>

      <div class="fname">
        <label for="fname">{{ selectedStudent.name || 'Nome do Estudante' }}</label>
      </div>

      <div class="matricula">
        <label for="matricula">Matrícula: {{ selectedStudent.matricula || '---' }}</label>
      </div>

      <div class="course">
        <label for="curso">{{ selectedStudent.curso || '---' }}</label>
      </div>

      <div class="group">
        <label for="turma">Turma: {{ selectedStudent.turma || '---' }}</label>
      </div>

      <div class="identity">
        <label for="identity">RA: {{ selectedStudent.ra || '---' }}</label>
      </div>

      <div class="date">
        <label for="date">Data de Nasc.: {{ selectedStudent.dataNascimento || '---' }}</label>
      </div>

      <div class="valid">
        <img src="https://img.icons8.com/?size=100&id=b-XFIFHiuLgD&format=png&color=000000" alt="Validade" />
        <label for="valid">2025</label>
      </div>
    </div>
  </div>
</div>

<div class="filter__container">
  <div class="filter__name">
    <input type="text" id="myInput" placeholder="Pesquisar por nomes" (input)="filterTable($event)" />
  </div>
</div>

<div class="table">
  <table>
    <thead>
      <tr>
        <th>Aluno</th>
        <th>Matrícula</th>
        <th>Curso</th>
        <th>Turma</th>
        <th>RA</th>
        <th>Data de Nasc.</th>
      </tr>
    </thead>
    <tbody id="studentTable">
      <tr *ngFor="let student of students" (click)="selectStudent(student)">
        <td>{{ student.name }}</td>
        <td>{{ student.matricula }}</td>
        <td>{{ student.curso }}</td>
        <td>{{ student.turma }}</td>
        <td>{{ student.ra }}</td>
        <td>{{ student.dataNascimento }}</td>
      </tr>
    </tbody>
  </table>
</div>

<div class="print-card">
  <button (click)="printCard()">Imprimir</button>
</div>
