<div class="boletim-container">
  <h2>Boletim Escolar</h2>
  <div class="boletim-actions" style="margin-bottom: 16px;">
    <button (click)="enviarPorEmail()">Enviar por e-mail</button>
    <button (click)="imprimirBoletim()">Imprimir</button>
  </div>
  <div class="aluno-info">
    <strong>Aluno:</strong> {{ aluno.nome }}<br>
    <strong>Ano:</strong> {{ aluno.ano }}<br>
    <strong>Turma:</strong> {{ aluno.turma }}
  </div>

  <table>
    <thead>
      <tr>
        <th>Disciplina</th>
        <th colspan="4">Notas (Bimestres)</th>
        <th colspan="4">Frequência (%)</th>
        <th>Média</th>
        <th>Freq. Total</th>
        <th>Situação</th>
      </tr>
      <tr>
        <th></th>
        <th>1º</th><th>2º</th><th>3º</th><th>4º</th>
        <th>1º</th><th>2º</th><th>3º</th><th>4º</th>
        <th></th><th></th><th></th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let d of aluno.disciplinas">
        <td>{{ d.nome }}</td>
        <td *ngFor="let n of d.notas">{{ n }}</td>
        <td *ngFor="let f of d.frequencias">{{ f }}%</td>
        <td>{{ getMedia(d) }}</td>
        <td>{{ getFreqTotal(d) }}%</td>
        <td [ngClass]="{
          'aprovado': getSituacao(d) === 'Aprovado',
          'reprovado': getSituacao(d).includes('Reprovado'),
          'recuperacao': getSituacao(d) === 'Recuperação'
        }">{{ getSituacao(d) }}</td>
      </tr>
    </tbody>
  </table>
</div>
