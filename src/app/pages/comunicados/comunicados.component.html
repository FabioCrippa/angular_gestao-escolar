<div class="comunicados-container">
  <h1>Comunicados</h1>
  <p>Envie comunicados importantes para alunos, professores e responsáveis.</p>

  <form class="form__comment">
    <div class="input">
      <label for="title">Título:</label>
      <input type="text" id="title" name="title" placeholder="Digite o título do comunicado" required />
    </div>

    <div class="textarea">
      <label for="message">Mensagem:</label>
      <textarea id="message" name="message" placeholder="Digite a mensagem do comunicado" required></textarea>
    </div>

    <div class="form-actions">
      <button type="submit">Enviar</button>
      <button type="reset">Limpar</button>
    </div>
  </form>
</div>
